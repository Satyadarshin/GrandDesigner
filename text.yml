version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: example
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wordpress_network
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network

  wpcli:
    image: wordpress:cli
    container_name: wpcli
    networks:
      - wordpress_network
    depends_on:
      - wordpress
    entrypoint: ["wp"]
    command: ["core", "install", "--url=http://wordpress.local", "--title=WordPress", "--admin_user=admin", "--admin_password=admin", "--admin_email=admin@example.com"]
    volumes:
      - wordpress_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: example

volumes:
  wordpress_data:
  db_data:

networks:
  wordpress_network:
    driver: bridge
