version: '3.3'

services:
  db:
    env_file: ".env"
    container_name: ${COMPOSE_PROJECT_NAME}-db
    image: mariadb:10.5
    volumes:
      - db-data:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB-DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

  wordpress:
    env_file: ".env"
    container_name: ${COMPOSE_PROJECT_NAME}-wp
    depends_on:
      - db
    image: wordpress:latest
    ports:
      - "8000:80"
    restart: always
    volumes: 
      - ./wp-content:/var/www/html/wp-content
      - ./backups:/var/www/backups
    environment:
      WORDPRESS_DB_HOST: ${MARIADB_HOST}
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}

  # @see https://hub.docker.com/_/wordpress/
  wp-cli:
    container_name: ${COMPOSE_PROJECT_NAME}-cli
    image: wordpress:cli
    user: 1000:1000
    # command: tail -f /dev/null # Keep the container running rather than exiting after initialization @see https://mklasen.com/adding-and-using-wp-cli-in-a-docker-compose-setup/
    command: 'wp core install'
    entrypoint: 'wp'
    environment:
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_DB_HOST: ${MARIADB_HOST}
    # volumes:
    #   - ./backups:/var/www/backups
    volumes_from:
      - wordpress
    depends_on:
      - db
      - wordpress

  phpmyadmin:
    env_file: ".env"
    container_name: ${COMPOSE_PROJECT_NAME}-phpmyadmin
    image: phpmyadmin:latest
    ports:
      - 8080:80
    environment:
      PMA_HOST: ${MARIADB_HOST}
      UPLOAD_LIMIT: '128M'

volumes:
    db-data:
    wp-content: